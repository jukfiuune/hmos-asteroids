{
    "jobs": [
        {
            "name": "param:asteroids-android-ready-device",
            "condition": "asteroids.android.ready=true",
            "cmds": [
                "start asteroids_richtap"
            ]
        }
    ],
    "services": [
        {
            "name": "asteroids_richtap",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/richtap.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        }
    ]
}