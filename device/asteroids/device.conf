# Facts about this phone (Nothing Phone (3a) and (3a) Pro, "asteroids"), read by the build and by the scripts that
# run on it (sourced as shell: NAME=value, no spaces around =). Everything else in m2/ is meant to hold for the
# Qualcomm platform or HarmonyOS in general.

# The name HarmonyOS shows, per variant: androidboot.pbid (Base or Pro), else the device tree's model.
NAME_BASE="Nothing Phone (3a)"
MODEL_BASE=A059
NAME_PRO="Nothing Phone (3a) Pro"
MODEL_PRO=A059P
# deviceInfo.chipType (ohos.boot.hardware); words joined by no-break spaces when written, init stops at a space.
CHIP="Snapdragon 7s Gen 3"

# Remote processors (/sys/class/remoteproc/*/name).
RPROC_ADSP=3000000.remoteproc-adsp
RPROC_MODEM=4080000.remoteproc-mss
# Display: the panel's backlight, and the GPU and display nodes the composer, allocator and render_service open.
BACKLIGHT=/sys/class/backlight/panel0-backlight
GPU_NODES="/dev/kgsl-3d0 /dev/dri/card0 /dev/dri/renderD128 /dev/dma_heap/system"
# ueventd's by-name directory of the UFS partitions.
UFS_BY_NAME=/dev/block/platform/soc/1d84000.ufshc/by-name
# Video decoder and encoder (msm_video).
VIDEO_NODES="/dev/video32 /dev/video33"
# Bluetooth: the chip's power control and UART; the firmware partition (per slot).
BT_POWER=/dev/btpower
BT_UART=/dev/ttyHS0
BT_FIRMWARE_PART=bluetooth
# Vibration: RichTap's device and effect configuration (from the odm partition).
RICHTAP_DEVICE=/dev/aac_richtap
RICHTAP_CONFIG=/odm/etc/aac_richtap.config
# Audio: the DSP modules partition (per slot) and the mixer and resource-manager files of this phone's sound card
# (vendor/etc/audio/sku_volcano), which Android's HAL would have bound into vendor/etc.
DSP_PART=dsp
AUDIO_MIXER=audio/sku_volcano/mixer_paths_volcano_qrd.xml
AUDIO_RESOURCES=audio/sku_volcano/resourcemanager_volcano_qrd.xml
# The Android helpers' library order (vendor is VNDK 34).
ANDROID_LIBPATH=/vendor/lib64:/system/lib64:/apex/com.android.vndk.v34/lib64:/apex/com.android.runtime/lib64:/apex/com.android.runtime/lib64/bionic
# The modem's EFS partitions (rmtfs serves them).
EFS_PARTS="modemst1 modemst2 fsg fsc"
