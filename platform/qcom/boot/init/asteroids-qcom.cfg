{
    "jobs": [
        {
            "name": "post-init",
            "cmds": [
                "start asteroids_route"
            ]
        },
        {
            "name": "post-fs-data",
            "cmds": [
                "start asteroids_android"
            ]
        },
        {
            "name": "param:asteroids-android-ready",
            "condition": "asteroids.android.ready=true",
            "cmds": [
                "start asteroids_adsprpcd",
                "start asteroids_pal",
                "start asteroids_sscrpcd",
                "start asteroids_bt_bridge",
                "start asteroids_camera"
            ]
        }
    ],
    "services": [
        {
            "name": "asteroids_route",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/route.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_android",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/android-root.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_adsprpcd",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/adsprpcd.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_pal",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/pal-server.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_sscrpcd",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/sscrpcd.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_bt_bridge",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/bt-bridge.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_camera",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/camera.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        }
    ]
}
