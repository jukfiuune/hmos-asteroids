# Meson cross file: the OpenHarmony 6.1 SDK clang and sysroot (HarmonyOS userspace: musl, ohos target). @HARMONY_BUILD@ is the build tree (build-zink.sh fills it in).
[binaries]
c = ['@HARMONY_BUILD@/ohos/sdk/native/llvm/bin/clang', '--target=aarch64-linux-ohos', '--sysroot=@HARMONY_BUILD@/ohos/sdk/native/sysroot']
cpp = ['@HARMONY_BUILD@/ohos/sdk/native/llvm/bin/clang++', '--target=aarch64-linux-ohos', '--sysroot=@HARMONY_BUILD@/ohos/sdk/native/sysroot']
ar = '@HARMONY_BUILD@/ohos/sdk/native/llvm/bin/llvm-ar'
strip = '@HARMONY_BUILD@/ohos/sdk/native/llvm/bin/llvm-strip'
pkg-config = 'false'

[built-in options]
c_args = ['-DVK_USE_PLATFORM_OHOS', '-femulated-tls']
cpp_args = ['-DVK_USE_PLATFORM_OHOS', '-femulated-tls']
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld', '-static-libstdc++', '-L@HARMONY_BUILD@/m2/ohos-link', '-lnative_buffer']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a78'
endian = 'little'
