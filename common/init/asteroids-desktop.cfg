{
    "jobs": [
        {
            "name": "param:asteroids-sceneboard-up",
            "condition": "init.sceneboard.finish=true",
            "cmds": [
                "setparam bootevent.boot.completed true",
                "stop bootanimation",
                "start asteroids_display_wake"
            ]
        },
        {
            "name": "param:asteroids-display-wake",
            "condition": "asteroids.display.wake=true",
            "cmds": [
                "start asteroids_display_wake",
                "setparam asteroids.display.wake false"
            ]
        },
        {
            "name": "post-fs-data",
            "cmds": [
                "mkdir /data/service/el1/public/wifi 0770 wifi wifi_group",
                "mkdir /data/service/el1/public/wifi/wpa_supplicant 0770 wifi wifi_group",
                "mkdir /data/service/el1/public/wifi/sockets 0770 wifi wifi_group",
                "mkdir /data/service/el1/public/dhcp 0770 dhcp dhcp",
                "mkdir /data/service/el1/public/userauth 0700 user_auth_host user_auth_host",
                "mkdir /data/service/el1/public/pinauth 0700 pin_auth_host pin_auth_host",
                "chown camera_host camera_host /sys/class/leds/led:torch_0/brightness",
                "chown camera_host camera_host /sys/class/leds/led:torch_3/brightness",
                "chown camera_host camera_host /sys/class/leds/led:switch_0/brightness",
                "start asteroids_camera_hdi",
                "symlink /dev/video33 /dev/vcodec_venc",
                "start asteroids_battery_hdi",
                "chown power_host system /sys/power/state",
                "chmod 0660 /sys/power/state",
                "chown power_host system /sys/power/wakeup_count",
                "chmod 0664 /sys/power/wakeup_count",
                "chown power_host system /sys/power/wake_lock",
                "chown power_host system /sys/power/wake_unlock",
                "chmod 0660 /sys/power/wake_lock",
                "chmod 0660 /sys/power/wake_unlock",
                "start asteroids_power_hdi"
            ]
        },
        {
            "name": "param:asteroids-audio",
            "condition": "asteroids.audio.start=true",
            "cmds": [
                "mkdir /data/data/.pulse_dir",
                "chown audio system /data/data/.pulse_dir",
                "mkdir /data/data/.pulse_dir/runtime",
                "chown audio system /data/data/.pulse_dir/runtime",
                "mkdir /data/data/.pulse_dir/state",
                "chown audio system /data/data/.pulse_dir/state",
                "mkdir /data/data/.pulse_dir/audiofocus",
                "chown audio system /data/data/.pulse_dir/audiofocus",
                "mkdir /data/service/el1/public/database 0711 ddms ddms",
                "mkdir /data/service/el1/public/database/audio_policy_manager 02770 audio ddms",
                "mkdir /data/data/hvs 0770 audio audio_host",
                "start audio_host",
                "start audio_server"
            ]
        },
        {
            "name": "param:asteroids-bluetooth",
            "condition": "asteroids.bluetooth.start=true",
            "cmds": [
                "start asteroids_bluetooth_hdi",
                "setparam vendor.setup_mpxx_dir_mode success",
                "mkdir /data/service/el1/public/fcm 0700 fusion_connectivity_manager_ext fusion_connectivity_manager_ext",
                "mkdir /data/service/el1/public/dsoftbus 0771 dsoftbus dsoftbus",
                "mkdir /data/service/el1/public/database 0771 ddms ddms",
                "mkdir /data/service/el1/public/database/dsoftbus 02770 dsoftbus ddms",
                "start bluetooth_service",
                "start fusion_connectivity_manager_ext",
                "start softbus_server"
            ]
        },
        {
            "name": "param:asteroids-sensors",
            "condition": "asteroids.sensors.start=true",
            "cmds": [
                "mkdir /data/service/el1/public/sensor",
                "chown sensor sensor /data/service/el1/public/sensor",
                "start asteroids_sensor_hdi",
                "start asteroids_vibrator_hdi"
            ]
        },
        {
            "name": "param:asteroids-sensor-hdi-ready",
            "condition": "bootevent.sheng_sensor_hdi.ready=true",
            "cmds": [
                "start sensors",
                "start asteroids_motion_hdi"
            ]
        }
    ],
