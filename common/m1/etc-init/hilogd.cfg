{
    "jobs": [
        {
            "name": "pre-init",
            "cmds": [
                "mkdir /data/log/ 0775 system log",
                "mkdir /data/log/dict/ 0755 logd log",
                "mkdir /data/log/hilog/ 0755 logd log",
                "write /proc/sys/net/unix/max_dgram_qlen 600",
                "start hilogd"
            ]
        },
        {
            "name": "post-fs",
            "cmds": [
                "mkdir /data/service/el0/public/for-all-app/hilog 0771 logd log"
            ]
        }
    ],
    "services": [
        {
            "name": "hilogd",
            "path": [
                "/system/bin/hilogd"
            ],
            "disabled": 1,
            "uid": "logd",
            "gid": [
                "log",
                "system",
                "readproc",
                "shell",
                "servicectrl"
            ],
            "sandbox": 0,
            "file": [
                "/dev/kmsg rd 0640 root root"
            ],
            "permission": [
                "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT"
            ],
            "socket": [
                {
                    "name": "hilogInput",
                    "family": "AF_UNIX",
                    "type": "SOCK_DGRAM",
                    "protocol": "default",
                    "permissions": "0222",
                    "uid": "logd",
                    "gid": "log",
                    "option": [
                        "SOCKET_OPTION_PASSCRED"
                    ]
                },
                {
                    "name": "hilogOutput",
                    "family": "AF_UNIX",
                    "type": "SOCK_SEQPACKET",
                    "protocol": "default",
                    "permissions": "0666",
                    "uid": "logd",
                    "gid": "log",
                    "option": [
                        "SOCKET_OPTION_PASSCRED"
                    ]
                },
                {
                    "name": "hilogControl",
                    "family": "AF_UNIX",
                    "type": "SOCK_SEQPACKET",
                    "protocol": "default",
                    "permissions": "0660",
                    "uid": "logd",
                    "gid": "log",
                    "option": []
                },
                {
                    "name": "hilogControlPub",
                    "family": "AF_UNIX",
                    "type": "SOCK_SEQPACKET",
                    "protocol": "default",
                    "permissions": "0666",
                    "uid": "logd",
                    "gid": "log",
                    "option": []
                }
            ],
            "start-mode": "condition",
            "secon": "u:r:hilogd:s0"
        },
        {
            "name": "starthilogcat",
            "path": [
                "/system/bin/hilog",
                "-w",
                "startByProduct"
            ],
            "disabled": 1,
            "uid": "logd",
            "gid": "log",
            "once": 1,
            "secon": "u:r:hilog:s0",
            "start-mode": "condition"
        },
        {
            "name": "startkmsglogcat",
            "path": [
                "/system/bin/hilog",
                "-w",
                "startByProduct",
                "-t",
                "kmsg"
            ],
            "disabled": 1,
            "uid": "logd",
            "gid": "log",
            "once": 1,
            "secon": "u:r:hilog:s0",
            "start-mode": "condition"
        }
    ]
}
