{
    "jobs": [
        {
            "name": "post-init",
            "cmds": [
                "start asteroids_clock"
            ]
        },
        {
            "name": "param:asteroids-samgr-ready",
            "condition": "bootevent.samgr.ready=true",
            "cmds": [
                "start asteroids_cgroups"
            ]
        },
        {
            "name": "param:asteroids-booted",
            "condition": "bootevent.boot.completed=true",
            "cmds": [
                "start asteroids_booted"
            ]
        }
    ],
    "services": [
        {
            "name": "asteroids_clock",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/clock.sh",
                "keep"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_cgroups",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/cgroups.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_booted",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/booted.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        },
        {
            "name": "asteroids_capture",
            "path": [
                "/asteroids/bin/busybox",
                "sh",
                "/asteroids/boot/svc/capture.sh"
            ],
            "uid": "root",
            "gid": [
                "root"
            ],
            "sandbox": 0,
            "once": 1,
            "disabled": 1,
            "start-mode": "condition"
        }
    ]
}