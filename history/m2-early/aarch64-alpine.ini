# Meson cross file: clang targeting aarch64 Alpine (musl), against the podman-built sysroot.
[binaries]
c = ['clang', '--target=aarch64-alpine-linux-musl', '--sysroot=@HARMONY_BUILD@/m2/sysroot']
cpp = ['clang++', '--target=aarch64-alpine-linux-musl', '--sysroot=@HARMONY_BUILD@/m2/sysroot']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[properties]
sys_root = '@HARMONY_BUILD@/m2/sysroot'
pkg_config_libdir = '@HARMONY_BUILD@/m2/sysroot/usr/lib/pkgconfig:@HARMONY_BUILD@/m2/sysroot/usr/share/pkgconfig'

[built-in options]
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a78'
endian = 'little'
