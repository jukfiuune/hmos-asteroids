{
    "jobs": [
        {
            "name": "post-fs-data",
            "cmds": [
                "mkdir /data/service/el1/public/memmgr",
                "chown memmgr memmgr /data/service/el1/public/memmgr",
                "chmod 0775 /data/service/el1/public/memmgr",
                "restorecon /data/service/el1/public/memmgr",
                "start memmgrservice"
            ]
        },
        {
            "name": "init",
            "cmds": [
                "write /proc/1/oom_score_adj -1000",
                "mkdir /dev/memcg",
                "mkdir /dev/memcg/perf_critical",
                "write /dev/memcg/perf_critical/memory.name perf_critical",
                "write /dev/memcg/perf_critical/memory.app_score 0",
                "write /dev/memcg/perf_critical/memory.zswapd_single_memcg_param 0 0 50",
                "mkdir /dev/memcg/perf_sensitive",
                "write /dev/memcg/perf_sensitive/memory.name perf_sensitive",
                "write /dev/memcg/perf_sensitive/memory.app_score 0",
                "write /dev/memcg/perf_sensitive/memory.zswapd_single_memcg_param 60 0 50",
                "mkdir /dev/memcg/stratovirt",
                "write /dev/memcg/stratovirt/memory.name stratovirt",
                "write /dev/memcg/stratovirt/memory.app_score 200",
                "write /dev/memcg/stratovirt/memory.zswapd_single_memcg_param 60 50 50",
                "mkdir /dev/memcg/Camera",
                "write /dev/memcg/Camera/memory.name Camera",
                "write /dev/memcg/Camera/memory.app_score 200",
                "write /dev/memcg/Camera/memory.zswapd_single_memcg_param 60 50 50",
                "mount cgroup none /dev/memcg memory",
                "chown system system /dev/memcg",
                "chown system system /dev/memcg/tasks",
                "chown system system /dev/memcg/memory.oom_control",
                "chown system system /dev/memcg/cgroup.event_control",
                "chown system system /dev/memcg/memory.pressure_level",
                "chown memmgr memmgr /proc/no_watermark",
                "chown memmgr memmgr /sys/kernel/dma_pool/dma_pool_watermark",
                "chmod 0755 /dev/memcg",
                "chmod 0666 /dev/dma_reclaim",
                "chmod 0755 /dev/memcg/tasks",
                "chmod 0755 /dev/memcg/memory.oom_control",
                "chmod 0755 /dev/memcg/cgroup.event_control",
                "chmod 0755 /dev/memcg/memory.pressure_level",
                "chmod 0200 /proc/no_watermark",
                "chmod 0644 /sys/kernel/dma_pool/dma_pool_watermark",
                "mkdir /dev/shm",
                "mount tmpfs tmpfs /dev/shm rw nosuid noexec size=1G",
                "restorecon /dev/shm",
                "mkdir /mnt/sandbox/shm",
                "mount tmpfs tmpfs /mnt/sandbox/shm rw nosuid noexec size=1G",
                "chmod 0711 /mnt/sandbox/shm",
                "restorecon /mnt/sandbox/shm",
                "chown memmgr memmgr /proc/sys/vm/memctrl",
                "chown memmgr memmgr /proc/sys/vm/memctrl/mem_ledger/mem_ledger_event",
                "chown memmgr memmgr /proc/sys/vm/memctrl/mem_slice"
            ]
        },
        {
            "name": "init && param:ohos.boot.vendor.ddrsize=6",
            "condition": "init && ohos.boot.vendor.ddrsize=6",
            "cmds": [
                "write /dev/memcg/memory.avail_lru_anon_wmark 1000",
                "write /dev/memcg/perf_sensitive/memory.app_score 300",
                "write /dev/memcg/perf_sensitive/memory.zswapd_single_memcg_param 60 50 50",
                "write /dev/memcg/perf_critical/memory.app_score 200",
                "write /dev/memcg/perf_critical/memory.zswapd_single_memcg_param 50 50 50"
            ]
        },
        {
            "name": "init && param:ohos.boot.vendor.ddrsize=8",
            "condition": "init && ohos.boot.vendor.ddrsize=8",
            "cmds": [
                "write /dev/memcg/memory.avail_lru_anon_wmark 1000",
                "write /dev/memcg/perf_sensitive/memory.app_score 300",
                "write /dev/memcg/perf_sensitive/memory.zswapd_single_memcg_param 60 50 50",
                "write /dev/memcg/perf_critical/memory.app_score 200",
                "write /dev/memcg/perf_critical/memory.zswapd_single_memcg_param 50 0 50"
            ]
        },
        {
            "name": "init && param:ohos.boot.vendor.ddrsize=12",
            "condition": "init && ohos.boot.vendor.ddrsize=12",
            "cmds": [
                "write /dev/memcg/memory.avail_lru_anon_wmark 1500"
            ]
        },
        {
            "name": "init && param:ohos.boot.vendor.ddrsize=16",
            "condition": "init && ohos.boot.vendor.ddrsize=16",
            "cmds": [
                "write /dev/memcg/memory.avail_lru_anon_wmark 2500"
            ]
        },
        {
            "name": "init && param:ohos.boot.vendor.ddrsize=24",
            "condition": "init && ohos.boot.vendor.ddrsize=24",
            "cmds": [
                "write /dev/memcg/memory.avail_lru_anon_wmark 2500"
            ]
        },
        {
            "name": "init && param:ohos.boot.vendor.ddrsize=32",
            "condition": "init && ohos.boot.vendor.ddrsize=32",
            "cmds": [
                "write /dev/memcg/memory.avail_lru_anon_wmark 2500"
            ]
        },
        {
            "name": "param:bootevent.boot.completed=true",
            "condition": "bootevent.boot.completed=true",
            "cmds": [
                "exec /system/bin/chown -R memmgr:memmgr /data/service/el1/0/hyperhold",
                "exec /system/bin/chown -R memmgr:memmgr /data/vendor/hyperhold"
            ]
        }
    ],
    "services": [
        {
            "name": "memmgrservice",
            "path": [
                "/system/bin/sa_main",
                "/system/profile/memmgrservice.json"
            ],
            "uid": "memmgr",
            "gid": [
                "memmgr",
                "shell"
            ],
            "writepid": [
                "/dev/memcg/perf_critical/cgroup.procs"
            ],
            "caps": [
                "DAC_OVERRIDE",
                "DAC_READ_SEARCH",
                "CAP_SYS_RESOURCE",
                "CAP_KILL",
                "CAP_SYS_NICE",
                "CAP_SYS_PTRACE"
            ],
            "apl": "system_basic",
            "permission": [
                "ohos.permission.KILL_APP_PROCESSES",
                "ohos.permission.BUNDLE_ACTIVE_INFO",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
                "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS_EXTENSION",
                "ohos.permission.DISTRIBUTED_DATASYNC",
                "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
                "ohos.permission.RUNNING_STATE_OBSERVER",
                "ohos.permission.GET_RUNNING_INFO",
                "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
                "ohos.permission.GET_INSTALLED_BUNDLE_LIST",
                "ohos.permission.GET_SUSPEND_STATE",
                "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
                "ohos.permission.RECEIVER_STARTUP_COMPLETED",
                "ohos.permission.ACCESS_FUSION_MANAGER",
                "ohos.permission.BLOCK_ALL_APP_START",
                "ohos.permission.ACCESS_LOWPOWER_MANAGER",
                "ohos.permission.RECEIVE_UPDATE_MESSAGE",
                "ohos.permission.RECEIVE_FUSION_MESSAGES"
            ],
            "permission_acls": [
                "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS_EXTENSION",
                "ohos.permission.BLOCK_ALL_APP_START"
            ],
            "sandbox": 0,
            "secon": "u:r:memmgrservice:s0"
        }
    ]
}
