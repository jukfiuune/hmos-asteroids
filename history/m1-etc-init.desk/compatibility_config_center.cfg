{
    "jobs": [
        {
            "name": "services:compatibility_config_center",
            "cmds": [
                "mkdir /data/service/el1/public/multidevicecompatibility/ 0744 compatibility_config_center compatibility_config_center",
                "mkdir /data/service/el1/public/multidevicecompatibility/compatibility_config_center 0744 compatibility_config_center compatibility_config_center",
                "mkdir /data/service/el1/public/database/compatibility_config_center 0744 compatibility_config_center ddms",
                "mkdir /data/service/el1/public/database/compatibility_config_center/rdb 0744 compatibility_config_center ddms"
            ]
        }
    ],
    "services": [
        {
            "name": "compatibility_config_center",
            "path": [
                "/system/bin/sa_main",
                "/system/profile/compatibility_config_center.json"
            ],
            "ondemand": false,
            "once": 1,
            "uid": "compatibility_config_center",
            "gid": [
                "compatibility_config_center"
            ],
            "start-mode": "normal",
            "secon": "u:r:compatibility_config_center:s0",
            "apl": "system_basic",
            "permission": [
                "ohos.permission.REPORT_SECURITY_EVENT",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
                "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
                "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
                "ohos.permission.GET_INSTALLED_BUNDLE_LIST"
            ],
            "jobs": {
                "on-start": "services:compatibility_config_center"
            }
        }
    ]
}
